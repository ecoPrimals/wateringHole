# ═══════════════════════════════════════════════════════════════
# Affinity Table — Neural API routing bias
# ═══════════════════════════════════════════════════════════════
#
# Used by biomeOS ProviderWeight::score() topology factor.
# Higher affinity = stronger preference for this path.

[affinity]
same_gate = 1.0
same_segment = 0.9
cross_segment_bridged = 0.7
cross_site_10g_trunk = 0.85
neighborhood_wired = 0.8
neighborhood_p2p_radio = 0.6
cellular_failover = 0.4
vps_relay = 0.4
wan_turn = 0.3
remote_contract = 0.3
portable_adb = 0.95
portable_wifi = 0.5
portable_cellular = 0.2

# ═══════════════════════════════════════════════════════════════
# Transport Inference Rules — biomeOS auto-detection
# ═══════════════════════════════════════════════════════════════
#
# When gate_id comparison is unavailable, biomeOS infers affinity
# from the transport type used to reach the provider:
#
# UnixSocket           → same_gate (1.0)
# AbstractSocket       → same_gate (1.0)
# TcpSocket(localhost) → same_gate (1.0)
# TcpSocket(private IP)→ same_segment (0.9)
# TcpSocket(public IP) → wan_turn (0.3)
# HttpJsonRpc(localhost)  → same_gate (1.0)
# HttpJsonRpc(private IP) → same_segment (0.9)
# HttpJsonRpc(public IP)  → wan_turn (0.3)

# ═══════════════════════════════════════════════════════════════
# Mesh Overlays — logical topology layered on physical hardware
# ═══════════════════════════════════════════════════════════════
#
# Physical topology (above) describes L1/L2: switches, cables, subnets.
# Mesh overlays describe L3+: encrypted tunnels and service mesh links
# that span physical boundaries. A gate may appear in both a hardware
# zone AND one or more mesh overlays.

[mesh.songbird_covalent]
description = "Songbird TCP :7700 federation mesh — covalent trust, LAN backbone"
transport = "tcp_7700"
trust = "covalent"
peers = [
    { gate = "eastGate", site = "house1", status = "live" },
    { gate = "golgi", site = "vps_do_nyc", status = "live" },
    { gate = "ironGate", site = "house2", status = "live" },
    { gate = "southGate", site = "house2", status = "live_validation_gate" },
    { gate = "strandGate", site = "house2", status = "live" },
    { gate = "westGate", site = "house2", status = "live" },
    { gate = "blueGate", site = "house2", status = "live" },
    { gate = "biomeGate", site = "house1", status = "tower_staged" },
    { gate = "swiftGate", site = "house2", status = "enrolling" },
    { gate = "grapheneGate", site = "portable", status = "live_tcp_only" },
]
note = "LAN peers discover via bootstrap_peers. VPS peer (golgi) relays for cross-WAN. 5 house2 gates enrolling via autonomous enrollment (Wave 155a)."

[mesh.wireguard_wan]
