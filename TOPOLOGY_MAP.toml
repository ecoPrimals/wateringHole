# Ecosystem Network Topology Map
#
# Machine-readable topology for Neural API routing decisions.
# Updated by discovery.peers RTT measurements + manual annotation.
#
# Segments define network boundaries with distinct latency profiles.
# The Neural API uses segment affinity to bias capability.call routing
# toward local providers (same-gate > same-segment > cross-segment > WAN).
#
# Last updated: 2026-06-02 (Wave 68)

[meta]
version = "3.0.0"
wave = 115
measured_by = "manual + discovery.peers (planned)"
last_updated = "2026-06-17"
wan_model = "single_exit_star"
site_topology = "star_with_10g_backbone"
neighborhood = "Old Everett, Lansing MI"

[sites.house1]
address = "4422 Southgate Ave, Lansing MI 48910"
description = "Corner lot, 1920 build. ATT fiber drop, CRS310, sporeGate router."
role = "primary_periplasm"

[sites.house2]
address = "641 Samantha Ave, Lansing MI 48910"
description = "Adjacent west of House 1. 1920 build. Omada switch, compute towers."
role = "compute_farm"
link_to_house1 = "80m AOC (10G SFP+), ~20m physical distance (adjacent lots)"

