    "sfp+1 → Omada SX3008F (10G trunk, 80m AOC)",
    "sfp+2 → eastGate (10G compute)",
    "etherX → northGate (Win/5090, 2.5G)",
    "ether6 ← Flint 2 H1 lan1 (2.5G, edge router LAN trunk)",
    "ether8 ← sporeGate eno1 (2.5G, compute node)",
]
gates = ["sporeGate", "eastGate", "northGate"]
upstream = "Flint 2 H1 (edge router at 192.168.4.1)"

