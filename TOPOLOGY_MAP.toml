# Ecosystem Network Topology Map
#
# Machine-readable topology for Neural API routing decisions.
# Updated by discovery.peers RTT measurements + manual annotation.
#
# Segments define network boundaries with distinct latency profiles.
# The Neural API uses segment affinity to bias capability.call routing
# toward local providers (same-gate > same-segment > cross-segment > WAN).
#
# Last updated: 2026-06-24 (Wave 126)

[meta]
version = "7.0.0"
wave = 127
measured_by = "manual + metalForge probes + agentic deployment"
last_updated = "2026-06-27"
wan_model = "single_exit_star"
site_topology = "star_with_10g_backbone"
neighborhood = "Old Everett, Lansing MI"

# ═══════════════════════════════════════════════════════════════
# Two-Layer Architecture (Wave 127)
# ═══════════════════════════════════════════════════════════════
#
# Infrastructure Layer (always-on, network survives compute loss):
#   ATT BGW320 (WAN boundary, passthrough only)
#       → Flint 2 H1 (plasma membrane: edge router, NAT/DHCP/DNS/firewall)
#           → CRS310 (hub 1: L2 backbone, 2.5G/10G)
#               → Omada SX3008F (hub 2: L2 extension via 10G AOC to House 2)
#                   → TL-SG605S-M2 (2.5G expansion off Omada)
#                       → Flint 2 H2 (WiFi AP, bridge mode)
#
# Compute Layer (ephemeral, hot-pluggable):
#   sporeGate (.3) — WireGuard hub, Caddy, Forgejo, services
#   eastGate — 10G compute
#   northGate — gaming/spare compute
#   fieldGate — House 2 remote compute
#
# Key invariant: unplugging ANY compute node leaves internet intact.
