#   local:        <0.1ms  (UDS, same machine)
#   same_segment: <1ms    (LAN, same switch)
#   cross_segment: 2-5ms  (Eero bridge, routed subnet)
#   vps_relay:    20-50ms (BTSP through VPS)
#   wan_turn:     50-200ms (TURN relay through VPS)

