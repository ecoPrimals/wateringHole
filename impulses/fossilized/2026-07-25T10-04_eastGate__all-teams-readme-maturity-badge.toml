[summary]
title = "All teams: add external maturity badge + metrics date to README"
description = """
Cross-ecosystem convergence standard requires two additions to every \
public-facing README: \

1. External maturity label from the canonical vocabulary: \
   experimental | research-ready | deployment-ready | production-candidate | \
   externally-validated \
   Place in README top-matter (first 10 lines). Internal grades (stadial, \
   wave, A++, LEGENDARY) should NOT appear in the first 20 lines. \

2. Metrics date comment: <!-- metrics: YYYY-MM-DD --> \
   After any line displaying LOC, test count, shader count, or other \
   numeric claim. Enables staleness detection by spore-validate refresh. \

Example README header: \
```md \
# myPrimal \
\
**External maturity**: deployment-ready \
**LOC**: 45,231 | **Tests**: 1,203 <!-- metrics: 2026-07-25 --> \
``` \

Standard: foundations/EXTERNAL_CLAIM_CONVERGENCE_STANDARD.md §1 (S1) + §3 (S9, S10)"""

