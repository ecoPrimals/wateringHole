[summary]
title = "beardog.fido2.ceremony — Multi-Source Tap-Sequence Entropy System"
description = """
Implemented a full tap-sequence entropy ceremony in bearDog: the human taps a SoloKey \
N times in rapid succession, each tap producing a CTAP2 GetAssertion with a fresh \
OS-RNG challenge. The hardware signature nonce (Tier 2), the human motor timing jitter \
(Tier 3), and the OS-RNG challenge (Tier 1) are mixed per-tap via BLAKE3 keyed hash \
into a single 32-byte entropy output.

This is a new entropy source for the genetic process and Loam Certificate seeding, \
combining three physically independent sources where no single compromise can predict \
the output.

Live hardware exploration discovered a P0 SoloKey firmware issue: the device enters \
an irrecoverable ERR_CHANNEL_BUSY state after timed-out CTAP2 commands. Only physical \
unplug/replug clears it. CTAPHID_CANCEL (0x91) support was added to mitigate stale \
channel data but cannot fix the firmware-level lock.

All code compiles clean, 33 tests passing, 0 warnings.
"""

