[protocol_notes]
entropy_tiers = """
Tier 1 — OS-RNG challenge (32 bytes/tap): rand::random()
Tier 2 — ES256 hardware RNG nonce (~64 bytes/tap): SoloKey internal CSPRNG
Tier 3 — Human temporal (20 bytes/tap): reaction_ns, inter_tap_interval_ns, eagain_count, keepalive_count
5 taps = ~600 bytes multi-source → 32 bytes via BLAKE3 keyed hash
"""
