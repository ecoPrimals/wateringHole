[summary]
title = "GPU buffer alignment panic fix, 13 test promotions, deep debt sweep"
description = """
Root-caused 3 persistent test failures to bytemuck::cast_slice alignment panic \
in the canonical GPU readback path (map_staging_buffer + submit_and_map). \
GPU mapped memory may not be aligned to T's requirement (f64 needs 8-byte, \
mapped buffer can be 4-byte aligned). Fixed with aligned_copy_from_mapped<T>() \
that copies through byte slices. This was a deep runtime bug affecting all \
f64 GPU readback operations.

Additionally promoted 13 tests from #[ignore] to active by removing redundant \
double-gating (tests had both #[ignore] and get_test_device_if_f64_gpu_available() \
early-return). All 13 pass on both real GPU and llvmpipe.

Dead OdeFunction type alias removed. mul_add evolution applied. Zero clippy \
warnings (--workspace --all-features --all-targets). 12-axis deep debt scan clean.
"""

