# FRAGO: Transport Evolution — Capability-Addressed Routing
# Phase 2: Songbird-routed IPC replaces direct UDS/TCP discovery

[impulse]
id = "wave79-transport-evolution-capability-routing"
type = "frago"
from = "eastGate"
to = ["songBird", "bearDog", "biomeOS", "all-primals"]
date = "2026-06-05"
updated = "2026-06-09T09:30"
priority = "P2"
owner = "songBird + biomeOS"
note = """
Transport evolution drives WAN/LAN/cross-arch deployment readiness.
A primal that accepts TRANSPORT_ENDPOINT can deploy identically on
eastGate (UDS), strandGate (UDS+TCP), golgiBody (TCP), Pixel (UDS),
or any future topology. Without it, every deployment is bespoke.

KEY MILESTONE (Wave 101): Mesh is LIVE. SB-TLS-LAN-01 + SB-SECURITY-URL-01
both RESOLVED. eastGate↔strandGate mesh proven stable (11.6h+).
Transport adoption at 10/11 non-exempt primals. Depot refreshed (14/14).
Zero P1 blockers in the ecosystem.
"""

[current_state]
mesh = "LIVE — eastGate↔strandGate bidirectional, 11.6h+ stable, all 4 criteria PASS"
transport_adoption = "10/11 non-exempt primals (toadStool is sole remaining gap)"
nucleus = "13/13 alive on eastGate, 12/12 liveness+readiness, 11/12 capabilities"
depot = "14/14 x86_64-musl fresh (Wave 102 rebuild). 1/14 aarch64 (sourdough only)"
self_knowledge = "Zero violations — barracuda+rhizoCrypt sourdough-core deps removed"
ipc_resolve = "NOT YET SHIPPED — songBird Phase 2 M1 blocker"

[context]
reason = """
UDS is convergent evolution — correct first step but not final form.
UDS is Unix-only, single-machine, path-length-limited, and not isomorphic.
The target is capability-addressed routing through Songbird, where primals
never know or choose their transport.

sourDough is the REPOSITORY OF PRIMAL STANDARDS — it defines wire formats
and validates compliance externally. Primals implement TransportEndpoint
locally using self-knowledge only. The wire format is the contract.
"""
reference = "primalSpring/docs/TRANSPORT_EVOLUTION.md"

# ──────────────────────────────────────────────────────────────
# REMAINING WORK — what blocks WAN/LAN/cross-arch deployments
# ──────────────────────────────────────────────────────────────

[remaining.toadstool_transport]
id = "TRANSPORT-TOADSTOOL"
description = "toadStool is the only non-exempt primal without TransportEndpoint"
owner = "toadStool"
priority = "P2"
why = """toadStool has 101 TCP refs across GPU compute dispatch, orchestration IPC,
and health probes. Without transport injection, toadStool deployments require
manual port configuration — blocking isomorphic cross-arch deployment."""
action = """Implement TransportEndpoint locally in toadstool-types. Accept
TRANSPORT_ENDPOINT env var. ~30 lines for connect_transport(). See sweetGrass
sweet_grass_core::transport or nestGate nestgate-types::transport for reference."""

[remaining.songbird_ipc_resolve]
id = "SONGBIRD-IPC-RESOLVE"
description = "songBird ipc.resolve must return structured TransportEndpoint JSON"
owner = "songBird"
priority = "P2"
why = """10 primals accept TRANSPORT_ENDPOINT but nobody produces it yet. ipc.resolve
currently returns plain socket paths or host:port strings. Once it returns structured
JSON, Tower Atomic can inject endpoints at composition deploy time — unlocking
topology-aware deployment across LAN, WAN, and cross-arch."""
action = """Evolve ipc.resolve response from string to:
  { "transport": "uds", "path": "/run/biomeos/beardog.sock" }
  { "transport": "tcp", "host": "192.168.1.173", "port": 9100 }
  { "transport": "mesh_relay", "peer_id": "strandgate", "capability": "security" }
This is Phase 2 M1 — the keystone that connects consumer-side transport injection
(10/11 adopted) to producer-side endpoint resolution."""

[remaining.biomeos_orchestration]
id = "BIOMEOS-LOCALTRUSTED"
description = "biomeOS v4.14 rebuild needed — LocalTrusted access for nucleus-deploy --graph-deploy"
owner = "biomeOS"
priority = "P2"
why = """nucleus-deploy --graph-deploy calls composition.deploy via UDS JSON-RPC. Currently
auth-gated by BTSP. v4.14 (a459ec58) adds LocalTrusted access level — UDS callers get
orchestration method access without capability tokens. Unblocks automated graph deployment."""
action = "Rebuild biomeOS from a459ec58+, harvest to depot. eastGate will revalidate --graph-deploy."

[remaining.coralreef_restart]
id = "CORALREEF-RESTART"
description = "Running coralReef binary is pre-capabilities.list — needs restart from depot"
owner = "eastGate"
priority = "LOW"
why = "Depot has the fix (4c417a95). Process restart gets IPC compliance from 11/12 to 12/12."
action = "Restart coralReef from fresh depot binary on next NUCLEUS redeploy."

[remaining.cross_arch]
id = "CROSS-ARCH-AARCH64"
description = "12/14 primals need aarch64-linux-android cross-compilation for Pixel/GrapheneOS"
owner = "cellMembrane"
priority = "P3"
why = """deploy_pixel.sh has all 13 startup handlers wired. Only sourdough is built for
aarch64. Full Pixel NUCLEUS requires NDK cross-compile for remaining 12 primals.
Transport injection (10/11 done) means the same binaries work across architectures."""
action = "Set up NDK cross-compile pipeline in peptidoglycan. Priority: beardog, songbird, biomeos."

[remaining.wan_covalent]
id = "WAN-COVALENT"
description = "WAN mesh validation with flockGate"
owner = "flockGate"
priority = "P3"
why = """LAN mesh is proven. WAN mesh (flockGate at remote location) validates that the
transport abstraction works across network boundaries, NAT traversal, and latency.
songBird's relay + STUN/TURN infrastructure exists but is untested in production."""
action = "Coordinate with flockGate: deploy songbird with federation port, mesh.init to eastGate."

[remaining.irongate_mesh]
id = "IRONGATE-MESH"
description = "ironGate mesh enrollment — federation port not running"
owner = "ironGate"
priority = "LOW"
why = "ironGate has 23 UDS sockets deployed. Federation port activation enrolls 3rd LAN gate."
action = "Start songbird with --port 7700, mesh.init to eastGate + strandGate."

