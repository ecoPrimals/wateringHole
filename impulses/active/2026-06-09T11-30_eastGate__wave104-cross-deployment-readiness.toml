[remaining.beardog_pure_rust]
id = "BEARDOG-PURE-RUST"
owner = "bearDog"
priority = "P1"
description = "aws-lc-rs C-dep blocks ALL non-x86 ecoBin targets"
why = """aws-lc-rs contains C code using __memcpy_chk (glibc fortification symbol,
not in musl). bearDog is the security provider — every composition depends on it.
Blocks: aarch64-musl (ARM servers), aarch64-android (Pixel/grapheneGate),
future ARM VPS, and any non-glibc target. songbird+skunkbat+sourdough already
build clean for aarch64 (pure Rust). bearDog is the sole cross-arch blocker.
Per ecoBin standard, pure Rust is the means to universal portability."""
action = """Replace aws-lc-rs with RustCrypto suite (or rustls with rustcrypto-provider).
Validate: cargo build --release --target aarch64-unknown-linux-musl
Expected: ELF 64-bit LSB executable, ARM aarch64, statically linked"""

[remaining.wan_outer_membrane]
id = "WAN-OUTER-MEMBRANE"
owner = "cellMembrane"
priority = "P1"
description = "golgiBody outer membrane for WAN binary distribution (flockGate depot empty)"
why = """flockGate (WAN) has zero depot binaries. No binary distribution path defined.
Without it, WAN gates cannot deploy NUCLEUS or enroll in mesh. This is the outer
membrane face of the golgiBody diderm architecture."""
action = """Simplest path: Caddy on VPS adds /depot/ route serving /opt/plasmidBin/primals/.
Long-term: separate golgiBody-ext with covalent bond to inner membrane.
See architecture.golgibody section below."""

[remaining.graphenegate_bootstrap]
id = "GRAPHENEGATE-BOOTSTRAP"
owner = "eastGate"
priority = "P2"
description = "Pixel 8 as portable trust anchor + gate spawner"
why = """grapheneGate is not just aarch64 cross-compile — it is the portable physical
root of trust. BirdSong beacon proves family membership. Can bootstrap new gates on
arbitrary hardware via USB/WiFi. Blocked on BEARDOG-PURE-RUST."""
action = """After bearDog pure Rust: build full aarch64-android depot, deploy via
deploy_pixel.sh (all 13 handlers ready), validate Role 1 beacon broadcast.
See GRAPHENEGATE_BOOTSTRAP_STANDARD.md."""

[remaining.songbird_ipc_resolve]
id = "SONGBIRD-IPC-RESOLVE-M1"
owner = "songBird"
priority = "P2"
description = "ipc.resolve must return structured TransportEndpoint JSON"
why = """10-11 primals accept TRANSPORT_ENDPOINT but nobody produces it yet. ipc.resolve
currently returns plain socket paths. Once it returns structured JSON, Tower Atomic
can inject endpoints at composition deploy time — unlocking topology-aware deployment."""
action = """Evolve ipc.resolve response to structured format:
  { "transport": "uds", "path": "/run/biomeos/beardog.sock" }
  { "transport": "tcp", "host": "192.168.1.173", "port": 9100 }
  { "transport": "mesh_relay", "peer_id": "strandgate", "capability": "security" }"""

[remaining.cm_cascade_conflict]
id = "CM-CASCADE-CONFLICT"
owner = "cellMembrane"
priority = "P2"
description = "checksums.toml / freshness.toml ff-only conflicts on cascade"
why = """Recurring on Waves 99, 102, 103. Multiple gates independently write machine-
generated files (checksums after rebuild, freshness on cascade). merge-ff correctly
rejects diverged files, but these files are regenerable metadata, not source."""
action = """Implement auto-resolve: detect checksums.toml + freshness.toml conflicts,
resolve with 'theirs' (upstream wins). Long-term: single-writer model for checksums
via peptidoglycan. See AAR section below."""

[remaining.cm_vps_depot_sync]
id = "CM-VPS-DEPOT-SYNC"
owner = "cellMembrane"
priority = "P2"
description = "golgiBody inner→outer membrane binary flow for WAN depot"
why = """After build-carrying cascades land, VPS should auto-refresh depot from
peptidoglycan. This also serves as the WAN distribution endpoint."""
action = "Wire plasmid.refresh into cascade post-build hook. Serve via Caddy for WAN."

