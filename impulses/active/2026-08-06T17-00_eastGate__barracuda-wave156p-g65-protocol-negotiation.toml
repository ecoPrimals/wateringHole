[summary]
title = "G65 Protocol Negotiation — single-socket tarpc + JSON-RPC"
description = """
Implemented G65 standard per PROTOCOL_NEGOTIATION_SPEC.md. barraCuda now \
supports single-socket protocol negotiation on all accept loops. Clients \
send `PROTOCOLS: tarpc,jsonrpc\n`, server responds `PROTOCOL: tarpc\n`, \
and the connection proceeds in the selected protocol. Legacy clients that \
skip negotiation default to JSON-RPC — full backward compatibility.

New modules: ipc_protocol.rs (IpcProtocol enum), protocol_negotiation.rs \
(wire types + selection + negotiate_client). TransportStream gains peek() \
for non-consuming first-byte detection (TCP native, Unix MSG_PEEK). \
handle_tarpc_negotiated wraps the negotiated stream in serde_transport + \
LengthDelimitedCodec for tarpc BaseChannel serving.

protocols.list IPC method updated to advertise negotiation.g65: true. \
C2 dual-socket (.tarpc.sock) retained for backward compatibility.

forbid(unsafe_code) → deny(unsafe_code) in barracuda-core for single \
targeted allow on unix_peek() (libc::recv MSG_PEEK). barracuda crate \
retains forbid(unsafe_code).
"""

