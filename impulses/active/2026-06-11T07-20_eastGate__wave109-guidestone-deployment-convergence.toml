description = """Converge all 13 primals on a standard startup envelope.
No per-primal case blocks in deploy scripts. Every primal accepts:
  $PRIMAL server --bind-mode $PRIMAL_BIND_MODE --port $PORT
PlatformCapabilities::detect() auto-senses transport from environment.
PRIMAL_BIND_MODE becomes override-only."""

[stream1.items]
