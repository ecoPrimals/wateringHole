[summary]
title = "BTSP client-side handshake — Wave 151b standard evolution"
description = """
Complete BTSP ClientHello consumer-side implementation with two modes: \
(1) Bootstrap handshake (local HMAC-SHA256) for authenticating TO bearDog \
in strict mode, and (2) General BtspClient (delegated crypto via security \
provider) for authenticating to any BTSP-enforced peer. Integrated into \
compute.rs peer dispatch and commands.rs CLI. 3 integration tests + 5 unit \
tests. Zero clippy warnings, zero Windows warnings."""

