# FRAGO: westGate Enrollment — skunkBat Family Onboarding

[impulse]
id = "wave73-westgate-skunkbat-enrollment"
type = "frago"
from = "eastGate"
to = "westGate"
date = "2026-06-03"
priority = "P2"

[context]
reason = """
westGate incoming this week. skunkBat (defense primal) needs family seed
enrollment and mesh integration. This FRAGO defines the enrollment protocol
for the new gate operator.
"""

[enrollment]
gate_name = "westGate"
gate_type = "Physical (LAN)"
bond_type = "Covalent"
primary_primal = "skunkBat"
subnet = "192.168.1.0/24"

[enrollment.prerequisites]
operator = "westGate operator"
hardware = "TBD (incoming this week)"
network = "Same subnet as eastGate (192.168.1.x) — no cross-VLAN routing needed"
repos_needed = [
    "nestGate",
    "wateringHole",
    "plasmidBin",
    "bearDog",
    "songBird",
    "skunkBat",
]

[enrollment.steps]
step_1 = "Create .gate identity file: echo 'westGate' > .gate"
step_2 = "Clone ecoPrimals tree + submodule init"
step_3 = "Install plasmidBin: cargo install --path infra/plasmidBin"
step_4 = "Set family seed: export FAMILY_ID=westgate NODE_ID=tower1"
step_5 = "Start bearDog: beardog server --family-id westgate --orchestrator-id west-gate"
step_6 = "Start Songbird with mesh peers: SONGBIRD_PEERS='east-gate@192.168.1.144:7700,strand-gate@192.168.1.132:7700'"
step_7 = "Mesh init: send mesh.init RPC with bootstrap_peers objects"
step_8 = "Verify: discovery.peers returns 2+ peers, mesh.health_check all_healthy"
step_9 = "Fire sitrep: impulse.post --to eastGate --type sitrep --subject 'westGate online'"

[enrollment.mesh_config]
songbird_node_id = "west-gate"
songbird_federation_port = 7700
songbird_peers = "east-gate@192.168.1.144:7700,strand-gate@192.168.1.132:7700"
security_endpoint = "http://127.0.0.1:9900"

[enrollment.validation]
check_1 = "discovery.peers returns peer_count >= 2"
check_2 = "mesh.health_check shows all_healthy: true"
check_3 = "skunkBat defense.status responds on UDS"
check_4 = "primalSpring s_covalent_mesh scenario passes with westGate as 3rd peer"

[outcome]
expected = """
westGate joins the mesh as 3rd physical gate. Enables:
  - plasmodium collective validation (3+ gates required)
  - skunkBat defense capabilities available cross-mesh
  - Network threat monitoring from a distinct vantage point
"""
