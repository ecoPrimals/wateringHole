[context]
reason = """
The ecosystem has been using manual bash loops (git fetch/pull per repo)
for cascade sync despite cellMembrane having a fully typed Rust
implementation. Wave 84 fixed three operational gaps:

1. Git operations had no timeout → 60s timeout + SSH keepalive
2. Workspace resolution required ECOPRIMALS_ROOT → CWD walk-up added
3. Default divergence policy was 'flag' → upgraded to 'merge-ff'

Now membrane temporal.cascade is robust enough to be the sole sync
interface. Manual git loops waste time and miss divergence detection.
"""

