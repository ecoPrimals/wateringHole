id = "SB-FEDERATION-01"
description = "Songbird federation TCP listener does not start in NUCLEUS server mode"
owner = "songBird + biomeOS"
priority = "P1"
detail = """
songbird receives SONGBIRD_FEDERATION_PORT=7700 via env (confirmed in /proc/PID/environ)
but does not open a TCP listener on that port. Opens 8081 (discovery) and 8091 but not
7700 or 8082 (default federation). Two sub-issues:
1. SONGBIRD_PRODUCTION_BIND_ADDRESS defaults to 127.0.0.1 — biomeOS needs to pass 0.0.0.0
2. Federation listener may not be wired into start_orchestrator() for server subcommand
strandGate Songbird :7700 works — different startup path. BLOCKER for 2-gate mesh proof.
"""

