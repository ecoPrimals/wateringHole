description = "NUCLEUS primals need supervision — they die silently and nothing restarts them"
why = """NUCLEUS went down 3+ times during Wave 105. Each time required manual restart.
There is no systemd unit, no watchdog, no health monitoring. This blocks autonomous gate
operation — gates cannot self-heal after binary replacement, power events, or crashes."""
action = """Options (pick one, evolve):
A. systemd --user units per-primal (most reliable, integrates with OS)
B. biomeOS lifecycle.watchdog (polls health.liveness, restarts on failure)
C. nucleus-deploy --supervised mode (registers with systemd on deploy)
Minimum viable: option B (biomeOS already has composition.deploy + graph.status)."""

