# ──────────────────────────────────────────────────────────────
# GATE ENROLLMENT PLAYBOOK (for any gate that comes online)
# ──────────────────────────────────────────────────────────────

[playbook.gate_enrollment]
description = """Universal playbook for when any gate powers on and needs deployment.
Until membrane gate.bootstrap exists, this is the manual procedure."""

steps = """
# 1. Identify gate arch
ARCH=$(uname -m)  # x86_64 → x86_64-unknown-linux-musl, aarch64 → aarch64-unknown-linux-musl

# 2. Create depot directory
mkdir -p ~/Development/ecoPrimals/infra/plasmidBin/primals/${ARCH}-unknown-linux-musl/

# 3. Fetch all primals from VPS
for p in beardog songbird biomeos nestgate coralreef sweetgrass squirrel loamspine rhizocrypt skunkbat petaltongue barracuda toadstool; do
  curl -o primals/${ARCH}-unknown-linux-musl/$p https://membrane.primals.eco/depot/${ARCH}-unknown-linux-musl/$p
  chmod +x primals/${ARCH}-unknown-linux-musl/$p
done

# 4. Verify checksums (compare against checksums.toml from git)
for p in primals/${ARCH}-unknown-linux-musl/*; do
  b3sum $p
done

# 5. Start songbird with federation
SONGBIRD_FEDERATION_PORT=7700 SONGBIRD_PRODUCTION_BIND_ADDRESS=0.0.0.0 \
  primals/${ARCH}-unknown-linux-musl/songbird server --socket /run/user/$(id -u)/biomeos/songbird.sock &

# 6. Initialize mesh (to VPS relay + any known LAN peers)
echo '{"jsonrpc":"2.0","method":"mesh.init","params":{"node_id":"<GATE_NAME>","peers":["157.230.3.183:7700"]},"id":1}' | \
  socat - UNIX-CONNECT:/run/user/$(id -u)/biomeos/songbird.sock

# 7. Start remaining NUCLEUS
for p in beardog biomeos nestgate coralreef sweetgrass squirrel loamspine rhizocrypt skunkbat petaltongue barracuda toadstool; do
  primals/${ARCH}-unknown-linux-musl/$p server --socket /run/user/$(id -u)/biomeos/${p}.sock &
done

# 8. Verify health
for sock in /run/user/$(id -u)/biomeos/*.sock; do
  echo '{"jsonrpc":"2.0","method":"health.liveness","id":1}' | timeout 2 socat - UNIX-CONNECT:$sock
done
"""

