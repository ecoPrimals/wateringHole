# GENERIC ENROLLMENT PIPELINE (for any new gate)
# ──────────────────────────────────────────────────────────────

[enrollment_pipeline]
note = """
Any gate team can self-enroll following this pipeline. Prerequisites: SSH access, sudo.

1. GET BINARY:
   Option A (WAN depot): curl -fsSL https://membrane.primals.eco/depot/primals/$(uname -m)-unknown-linux-musl/membrane -o /tmp/membrane
   Option B (LAN from sporeGate): scp irongate@192.168.4.237:~/.local/bin/membrane /tmp/membrane
   Option C (WG from golgi): scp root@10.13.37.1:/opt/membrane/membrane /tmp/membrane
   Then: chmod +x /tmp/membrane && sudo mv /tmp/membrane /usr/local/bin/

2. PREFLIGHT: membrane gate.preflight [--ip <gateway>]

3. WIREGUARD (if not yet configured):
   - Generate keys: wg genkey | tee /tmp/wg-private | wg pubkey > /tmp/wg-public
   - Push public key to wateringHole WIREGUARD_MESH.toml
   - Request golgi peer add from cellMembrane team (provide pubkey + assigned IP)
   - Create /etc/wireguard/wg0.conf with assigned 10.13.37.X and golgi peer
   - sudo systemctl enable --now wg-quick@wg0

4. BOOTSTRAP: sudo membrane gate.bootstrap <gate-name> --dry-run && sudo membrane gate.bootstrap <gate-name>

5. FIREWALL (optional):
   membrane firewall.generate --plasma-membrane --composition nucleus \\
     --wan <WAN> --lan <LAN> --subnet <SUBNET> --gate-name <NAME> \\
     --wg-iface wg0 --wg-port 51820 --format nftables | sudo tee /etc/nftables.conf
   Review, then: sudo nft -f /etc/nftables.conf

6. CASCADE: membrane temporal.cascade

7. VERIFY: membrane gate.status

8. REPORT: Push status update to wateringHole impulses/active/"""
