owner = "ALL teams (sourDough accelerates)"
priority = "P2"
guidestone_properties = ["P1-Deterministic", "P2-Reference-Traceable"]
description = """Replace fragile peek-and-guess protocol detection with riboCipher —
intentional transport signal routing modeled on ribosomal codon reading.
Each primal independently evolves to send/receive riboCipher signals.
Standard published in RIBOCIPHER_TRANSPORT_SIGNAL_STANDARD.md.

Root cause: ironGate/cellMembrane found that BTSP-encrypted first bytes are
indistinguishable from noise — peek-based routing hung on encrypted connections.
Additionally, primals disagree on what 'unknown byte' means (bearDog → BTSP,
biomeOS → HTTP). This divergence is a jelly-sting pattern that must converge.

sourDough accelerates adoption: scaffold bakes riboCipher into new primals,
validate audits existing primals, own IPC is the reference implementation."""

