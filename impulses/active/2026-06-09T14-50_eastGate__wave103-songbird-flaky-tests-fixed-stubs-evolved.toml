[changes.flaky_test_fix]
test = "ipc_resolve_returns_transport_endpoint_json_sourdough_wire_compat"
root_cause = """
VirtualRelayManager::default_base_dir() resolves to a shared filesystem path
($XDG_RUNTIME_DIR/biomeos/songbird/virtual/). Concurrent tests calling
ipc.register raced on binding the same UDS socket (e.g. beardog.sock),
causing EADDRINUSE failures.
"""
fix = """
IpcServiceHandler::new_isolated() — test-only constructor that gives each test
instance a unique temp directory for relay sockets (keyed by PID + nanos).
Applied across 34 test sites in service_tests.rs, dispatch.rs, meta.rs.
"""
production_impact = """
This flakiness masked a real design issue: the production relay manager uses
env-derived paths without namespace isolation. In multi-instance deployments,
concurrent Songbird processes could collide on relay sockets. The test fix
validates the isolation pattern that production should adopt for multi-tenant.
"""

