# WireGuard Mesh Topology — Multi-Site Sovereign Overlay
#
# Defines the encrypted overlay network connecting all sites regardless of
# physical transport. WireGuard provides the identity/encryption layer that
# makes any IP-bearing transport (fiber, cellular, P2P radio, VPS) equivalent.
#
# The mesh is hub-and-spoke with golgiBody as the relay hub for NAT traversal,
# but supports direct peer connections when both endpoints have public IPs.
#
# Last updated: 2026-06-23 (Wave 124)
# Authority: sporeGate (routing) + bearDog (key management)

