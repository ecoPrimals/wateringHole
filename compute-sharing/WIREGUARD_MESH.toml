# ═══════════════════════════════════════════════════════════════
# Subnet Carving Strategy
# ═══════════════════════════════════════════════════════════════

[subnet_carving]
note = """
Current state: flat 192.168.4.0/22 (all 1022 hosts in one broadcast domain).
This works fine for single-site. When marshGate deploys at House 2, carve:

Phase 1 (now): Keep flat /22. All devices get IPs from sporeGate DHCP.
Phase 2 (marshGate deploys): 
  - sporeGate DHCP shrinks to 192.168.4.0/24 (House 1 only)
  - marshGate DHCP serves 192.168.5.0/24 (House 2)
  - Inter-site routing via WireGuard overlay OR direct 10G trunk route
Phase 3 (neighborhood):
  - New gate serves 192.168.6.0/24
  - Joins mesh via P2P radio or Cat6a
Phase 4 (institute):
  - Remote gate serves 192.168.7.0/24
  - Joins mesh via WireGuard only

Migration path: No disruption. Existing /22 clients keep working.
New /24 carving only applies to NEW sites. House 1 stays .4.0/24 forever.
"""

[subnet_carving.dhcp_migration]
house1_current_pool = "192.168.4.100-249"
house1_post_carve_pool = "192.168.4.100-249"
house2_post_carve_pool = "192.168.5.100-249"
note = "No change for House 1 clients. House 2 clients get new range from marshGate."
