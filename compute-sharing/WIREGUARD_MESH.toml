# ═══════════════════════════════════════════════════════════════
# Routing Design
# ═══════════════════════════════════════════════════════════════

[routing]
model = "hub_and_spoke_with_direct_shortcuts"
hub = "golgi_body"

[routing.rules]
note = """
1. All peers maintain persistent tunnel to golgiBody (hub).
2. If two peers are on the same L2 segment (e.g. sporeGate + marshGate via 10G trunk),
   they establish a DIRECT peer connection (no relay needed, sub-1ms).
3. If both peers have public IPs, they can peer directly (skip hub).
4. All other traffic relays through golgiBody.
5. Site routers advertise their site subnet into the mesh.
6. biomeOS uses overlay IP for primal-to-primal RPC when cross-site.
"""

[routing.site_subnets]
house1 = "192.168.4.0/24"
house2 = "192.168.5.0/24"
neighborhood = "192.168.6.0/24"
institute = "192.168.7.0/24"
overlay = "10.13.37.0/24"

[routing.failover]
note = """
If ATT fiber at House 1 dies:
  1. sporeGate detects WAN loss (no DHCP renewal or gateway ping failure)
  2. sporeGate's cellular failover (Mint Mobile) activates (metric 500)
  3. WireGuard tunnel to golgiBody re-establishes via cellular
  4. All LAN devices keep working — traffic exits via cellular WAN
  5. If marshGate is deployed with House 2 fiber: traffic can also route
     sporeGate → 10G trunk → marshGate → House 2 ATT fiber → internet
"""

