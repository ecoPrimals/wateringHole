# SPDX-License-Identifier: CC-BY-SA-4.0
#
# ecosystem_manifest.toml — Machine-readable catalog of all ecoPrimals repositories
#
# Authority: wateringHole consensus
# Consumed by: cascade-pull, freshness checks, primalSpring s_ecosystem_freshness
#
# Fields:
#   org            — GitHub org (ecoPrimals, syntheticChemistry, sporeGarden)
#   local_path     — Path relative to ecoPrimals workspace root
#   membrane       — "inner-only" | "trailing-mirror" | "outer-only"
#   sync_source    — "github" (default) | "forgejo" (inner-only repos)
#   sync_priority  — "high" | "standard" | "low"
#   category       — "primal" | "spring" | "garden" | "infra" | "root"
#   description    — Short human description
#   github_repo    — Full GitHub repo path (org/name)
#   forgejo_repo   — Forgejo repo path (org/name on git.primals.eco)
#   default_branch — Git branch name (default: "main")

[meta]
version = "3.2.0"
generated = "2026-08-01"
# DEPRECATED: wave ID now lives in wave.toml (overwatch sole writer).
# This field is retained at last-known value for backward compat with older binaries.
wave = 155
total_repos = 40

# ═══════════════════════════════════════════════════════════════════
# WaterFall Sync Configuration
# ═══════════════════════════════════════════════════════════════════
# K-Derm model: Forgejo sits in the periplasm between gate plasma
# membranes and the extracellular GitHub outer mirror. WaterFall
# cascades evolution down from Forgejo to gate cytoplasms; gates
# push evolution back up through the periplasm.
#
# Pattern lineage: WaterFall parallels RootPulse (whitePaper) —
# both are firstLast biomeOS coordination patterns. RootPulse
# coordinates primals for single-repo VCS; WaterFall coordinates
# membranes for multi-repo ecosystem sync.

[sync]
forgejo_base_url = "https://git.primals.eco"
forgejo_ssh = "ssh://git@git.primals.eco:2222"
github_ssh = "git@github.com:"
forgejo_host = "golgiBody"
default_source = "temporal"
default_branch = "main"
divergence_policy = "merge-ff"
push_to_followers = true
# Push target: "forgejo" (sovereign mediator) or "all" (legacy dual-push).
# When set to "forgejo", temporal.sync pushes only to forgejo remote;
# the VPS push mirror handles GitHub propagation. Gates still pull from
# all remotes (GitHub may have external contributions).
push_target = "all"
# When true, cascade auto-fires a SYNC impulse on diverge detection.
# The impulse carries repo, remote HEADs, merge base, and suggested action.
diverge_impulse = true

[topology]
model = "diderm"
inner_membrane = "golgiBody"
outer_membrane = "golgiBody-ext"

[topology.hosts]
golgiBody = "golgi.primals.eco"
golgiBody-ext = "137.184.197.151"
graftGate = "10.13.37.13"

# K-Derm layer roles — which node handles which function in the
# waterFall relay chain. Bond types degrade outward:
# covalent (gate→inner) → ionic (inner→outer) → weak (outer→GitHub)
[topology.roles]
push_receiver = "golgiBody"           # cis face: receives gate pushes (Forgejo)
build_authorities = ["ironGate", "blueGate", "graftGate"]  # workhorse(ironGate), windows(blueGate), darwin(graftGate). sporeGate=foreman, eastGate=dev — build-capable but not primary builders
depot_server = "golgiBody"            # SOLE depot: all gates fetch from golgiBody via WAN TLS. No local depots.
sync_mediator = "sporeGate"           # structural: sync hub + impulse cascade
external_publisher = "golgiBody-ext"  # trans face: ships to GitHub (holds extracellular SSH keys)
remote_access = "golgiBody"           # RustDesk hbbs+hbbr — sovereign remote desktop relay (remote.primals.eco)

# ═══════════════════════════════════════════════════════════════════
# Compute Capabilities — GPU/shader/precision metadata
# ═══════════════════════════════════════════════════════════════════

[capabilities.compute]
SHADER_F64 = true
precision_tiers = ["f32", "f64"]
shader_backends = ["wgsl", "spirv", "glsl"]
gpu_gates = ["ironGate"]
notes = "f64 precision via SHADER_F64 feature on RTX 5070 Ti (ironGate). coralReef compiles shaders. barraCuda dispatches compute. Precision routing: barraCuda.precision.route selects f32/f64 path based on device capability."

# ═══════════════════════════════════════════════════════════════════
# Build Metadata — Sovereign CI Pipeline (plasmid.harvest)
# ═══════════════════════════════════════════════════════════════════
#
# Manifest-driven CI: plasmid.harvest reads these fields instead of
# hardcoding per-primal workarounds in bash scripts.
#
# Fields:
#   binary_name  — Deployed binary name (as installed in pepti depot)
#   package      — Cargo package for `--package` flag (workspace primals)
#   workspace    — Whether the primal uses a Cargo workspace
#   cargo_config — Whether .cargo/config.toml has custom linker/target config
#   targets      — Supported build targets (x86_64-musl, aarch64-musl)
#   notes        — CI quirks or build context
#
# Resolves: CI-DIV-01 (biomeOS), CI-DIV-02 (skunkBat), CI-DIV-03 (nestGate)

# ── Network Topology (G34/G35) ──────────────────────────────────
#
# Physical egress:
#   Internet ← ATT Box (192.168.4.1, ISP-owned, NAT) ← Flint (192.168.4.111, owned)
#                                                      ← flat LAN (192.168.4.0/22)
#
# The ATT box is untrusted ISP hardware. It sees traffic metadata
# (destinations, ports, timing) even when content is encrypted.
# G34 moves the Flint into the routing path so ATT sees only a
# single opaque WireGuard tunnel — no protocol fingerprinting.
#
# Agentic access: sporeGate has SSH key enrollment on all gates
# marked ssh_agentic = true. No manual credentials required.

[network]
att_gateway = "192.168.4.1"
flint_router = "192.168.4.111"
lan_subnet = "192.168.4.0/22"
wg_subnet = "10.13.37.0/24"
wg_hub = "golgiBody"
external_ip = "162.226.225.148"

[network.egress]
current = "att_direct"
target = "flint_tunnel"
notes = "G34: route all egress through Flint → single WG tunnel to golgi. ATT becomes dumb pipe."

# ── Sub-mesh Builder Topology ────────────────────────────────────
#
# The LAN mesh has distinct roles. Eventually capability.call will
# dispatch to available systems based on need and advertised capacity.
# For now, the sub-mesh pattern assigns fixed roles:
#
#   foreman     — orchestrates builds, owns topology + depot, dispatches work
#   workhorse   — primary compilation + HPC compute
#   dev         — overwatch, IDE, primalSpring evolution (builds for dev, not depot)
#   builder     — platform-specific compilation authority
#   cas_compute — CAS/provenance compute (NFT braid, DAG processing)
#   cas_storage — CAS/provenance data (tiered storage, braid archival)
#   deployer    — receives and installs binaries on target hardware
#   validator   — runs tests/probes on real hardware to confirm correctness
#
# Sub-mesh routing: foreman dispatches via Tower Atomic mesh.
# Future: capability.call auto-dispatch replaces fixed assignment.

# ── Foreman ──────────────────────────────────────────────────────
# sporeGate is NOT a primary builder. It orchestrates the fleet,
# owns the inner membrane → peptidoglycan layer, manages depot +
# topology + cascade. Builds only as last-resort fallback.

[sub_mesh.foreman]
gate = "sporeGate"
transport = "local"
roles = ["dispatch", "depot", "topology", "cascade", "peptidoglycan"]
fallback_targets = ["x86_64-unknown-linux-musl", "aarch64-linux-android"]
notes = "Foreman — orchestrates, does not build. Dispatches to workhorse/builders. Fallback-only builder for musl + Android NDK. Focus: inner membrane, depot authority, cascade coordination."

# ── Workhorse ────────────────────────────────────────────────────
# ironGate is the main HPC workhorse. Handles primary Linux builds,
# GPU compilation, and CAS compute (NFT braid processing).

[sub_mesh.workhorse]
gate = "ironGate"
transport = "mesh"
roles = ["builder", "hpc", "cas_compute", "gpu"]
targets = ["x86_64-unknown-linux-musl", "x86_64-unknown-linux-gnu"]
notes = "Main workhorse. i9-12900K + RTX 5070 Ti + 4x HDD enclave. Primary Linux builder (musl + gnu). GPU shader compilation. NFT braid CAS compute (paired with westGate data CAS)."

# ── Dev ──────────────────────────────────────────────────────────
# eastGate is the primary development machine. Builds for dev/test
# purposes but not the depot builder. Overwatch + primalSpring.

[sub_mesh.dev]
gate = "eastGate"
transport = "mesh"
roles = ["overwatch", "dev", "primalspring", "build_capable"]
targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]
notes = "Primary dev machine. Ryzen 9 7950X, 128GB RAM, 10G SFP+. Overwatch + primalSpring evolution. Build-capable but builds for dev/test, not depot. ARM64 cross-compilation when needed."

# ── CAS Storage ──────────────────────────────────────────────────
# westGate is the data braid CAS — tiered storage for provenance,
# archival, and braid data. Paired with ironGate compute CAS.

[sub_mesh.cas_storage]
gate = "westGate"
transport = "mesh"
roles = ["cas_storage", "braid_archival", "tiered_storage", "nest"]
notes = "Data braid CAS. Ryzen 7 5700X + 64GB + 2TB NVMe + 5x14TB HDD. Paired with ironGate (compute CAS). Nest Atomic testbed. rhizoCrypt/loamSpine/sweetGrass provenance storage."

# ── Platform Builders ────────────────────────────────────────────
# Sole compilation authorities for non-Linux platforms.

[sub_builders."x86_64-pc-windows-gnu"]
gate = "blueGate"
transport = "mesh"
builder_host = "10.13.37.12"
builder_port = 9800
role = "builder"
notes = "Windows builder. Sole Windows compilation authority. J12 LIVE E2E. builder.serve deployed (scheduled task, Aug 13)."

[sub_builders."aarch64-unknown-linux-musl"]
gate = "ironGate"
transport = "mesh"
builder_host = "192.168.4.237"
builder_port = 9800
role = "builder"
notes = "ARM64 Linux builder. First dispatch confirmed Wave 157k (Aug 12). grapheneGate (Pixel 8a) is the primary consumer. ironGate has aarch64-linux-gnu-gcc cross-toolchain + rustup target installed. builder.serve deployed (systemd, Aug 13)."

[sub_builders."aarch64-apple-darwin"]
gate = "graftGate"
transport = "mesh"
builder_host = "10.13.37.13"
builder_port = 9800
role = "builder"
notes = "Darwin/macOS builder. M4 Mac Mini. 15/15 primals compiled. Sole Apple compilation authority. builder.serve LIVE (launchd, Aug 13). TCP dispatch + riboCipher compatible."

