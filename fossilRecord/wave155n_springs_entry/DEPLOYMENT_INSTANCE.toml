# ──────────────────────────────────────────────────────────────
# ERROR RECOVERY (instance-specific troubleshooting)
# ──────────────────────────────────────────────────────────────

[troubleshooting]
ssh_timeout_golgi = "ping 157.230.3.183 — check if VPS is responding"
pepti_unreachable = "pepti routes through golgi (ProxyCommand) — fix golgi connectivity first"
songbird_stale = "ssh golgi 'pgrep -la songbird' — kill stale, restart with --federation --port 7700"
depot_stale = "membrane plasmid.harvest --force && membrane plasmid.depot_sync"
ndk_build_fail = "membrane plasmid.ndk.check — verify ANDROID_NDK_HOME and toolchain"
freshness_conflict = "git checkout --theirs freshness.toml && git add freshness.toml && git commit --no-edit"
