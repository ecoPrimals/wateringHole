# ──────────────────────────────────────────────────────────────
# AAR: RECURRING CASCADE CONFLICTS
# ──────────────────────────────────────────────────────────────

[aar.cascade_conflicts]
problem = """Recurring ff-only merge conflicts on cascade for plasmidBin (checksums.toml)
and wateringHole (freshness.toml). These have occurred on Waves 99, 102, and 103.
Pattern: gate-local edits to machine-generated files (checksums, freshness timestamps)
diverge from upstream. cascade uses merge-ff policy, so diverged files FAIL and require
manual stash/rebase/resolve. This blocks the cascade and requires operator intervention."""

root_cause = """Two files are both locally-generated AND upstream-synced:
  1. plasmidBin/checksums.toml — regenerated locally after depot rebuild, also pushed
     by strandGate or other gates after their rebuilds. Multiple gates rebuild
     independently → both push different checksums → ff-only fails.
  2. wateringHole/freshness.toml — auto-published by cascade on every gate. Multiple
     gates cascade within the same window → both push timestamped freshness → ff-only fails.
The merge-ff policy is correct for source code (flag divergence) but too strict for
machine-generated metadata files that are expected to diverge between gates."""

fix_options = """
Option A (recommended): Exempt machine-generated files from ff-only enforcement.
  cellMembrane cascade should detect checksums.toml and freshness.toml conflicts
  and auto-resolve with 'theirs' (upstream wins for timestamps/checksums).
  These files are always regenerable — the authoritative source is the depot
  binary itself, not the toml metadata.

Option B: Single-writer model. Only one gate (peptidoglycan or designated builder)
  writes checksums.toml. Other gates read-only. Freshness.toml written only by
  the cascade initiator, not by every gate.

Option C: Move to append-only/merge-friendly format. Freshness uses per-gate
  sections instead of overwriting a single timestamp. Checksums use per-gate
  hashes with 'latest wins' merge strategy.

cellMembrane should implement Option A as a quick fix, then evolve toward
Option B for checksums (single-builder model via peptidoglycan) as part of
the build-carrying cascades work (CM-BUILD-CASCADE)."""

occurrences = [
  "Wave 99: plasmidBin checksums.toml — stash/rebase/theirs resolve",
  "Wave 102: plasmidBin checksums.toml — stash/rebase/theirs resolve",
  "Wave 103: plasmidBin checksums.toml + wateringHole freshness.toml — both conflicted",
]

