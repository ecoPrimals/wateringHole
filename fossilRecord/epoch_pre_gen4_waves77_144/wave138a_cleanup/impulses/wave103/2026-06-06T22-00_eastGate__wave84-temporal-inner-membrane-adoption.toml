# ──────────────────────────────────────────────────────────────
# ARCHITECTURE: GOLGIBODY INNER/OUTER MEMBRANE + PEPTI LAYER
# ──────────────────────────────────────────────────────────────

[architecture.golgibody]
summary = """
The golgiBody diderm architecture has two membrane faces and a peptidoglycan
layer between them. The WAN mesh requires us to formalize this:

  INNER MEMBRANE (golgiBody-int)
    - Faces the LAN / covalent bonded gates
    - Serves depot binaries to eastGate, strandGate, ironGate
    - Syncs source via cascade (peptidoglycan relay to Forgejo)
    - Handles covalent interactions: authenticated, high-trust, low-latency
    - Current: golgiBody VPS at 137.184.197.151 (inner face operational)

  PEPTIDOGLYCAN LAYER
    - Build substrate between inner and outer membranes
    - Compiles primals (musl-static, cross-arch) from synced source
    - Stores depot binaries in plasmidBin
    - SSH trust established with inner membrane (Wave 92)
    - Current: operational for x86_64-musl, aarch64 pipeline in progress

  OUTER MEMBRANE (golgiBody-ext)
    - Faces WAN / external / ionic+weak interaction partners
    - Serves depot binaries to flockGate and future WAN gates
    - Handles ionic interactions: partially-trusted, NAT-traversed, higher latency
    - Handles weak interactions: public, untrusted, discovery-only
    - NEEDED: HTTP endpoint (Caddy /depot/) for WAN binary distribution
    - NEEDED: May require a separate golgiBody instance for true external facing

The WAN mesh (flockGate) likely requires an external membrane golgiBody that
links to the inner as a covalent bond. This external golgiBody serves the outer
face — parsing external (ionic, weak) interactions — while the inner golgiBody
maintains the LAN covalent trust boundary.

This maps to the diderm biological model:
  - Inner membrane: selective, high-trust transport (LAN, covalent)
  - Peptidoglycan: structural/build layer (compile, test, sign)
  - Outer membrane: interface to external environment (WAN, ionic, weak)
  - Periplasm: the space between — depot storage, binary staging
"""

inner_membrane = """Current golgiBody VPS. Serves LAN gates via SSH/cascade.
Pipeline: cascade → peptidoglycan build → plasmid.refresh → inner membrane serves.
Trust model: SSH keys, Forgejo HMAC webhooks, covalent bond authentication."""

outer_membrane = """NOT YET DEPLOYED. Required for WAN gates (flockGate).
Could be: (a) same VPS with Caddy /depot/ route facing WAN, or
(b) separate golgiBody instance with its own covalent bond to inner.
Option (a) is simplest: Caddy already runs, just add depot route.
Option (b) is correct long-term: true diderm separation, outer membrane
handles untrusted WAN traffic, inner membrane never faces external.
Trust model: BTSP tokens, beardog capability verification, TLS."""

peptidoglycan = """Build layer between membranes. Compiles static binaries.
Already operational for x86_64-musl. aarch64 pipeline blocked on bearDog C-dep.
Peptidoglycan is the air gap — source flows in (cascade), binaries flow out
(depot), but the build layer is isolated from both membrane faces."""

[outcome]
expected = """
Cascade is the sole sync interface. Depot freshness is maintained automatically
through build-carrying cascades. Cross-arch binaries are produced by peptidoglycan
for all target triples. VPS deployments stay current via automatic depot sync.

golgiBody inner membrane serves LAN covalent gates. Outer membrane serves WAN
ionic/weak interaction partners (flockGate, future external gates). Peptidoglycan
layer builds between them — source in, binaries out, isolated from both faces.

This infrastructure enables: LAN gate enrollment (cascade + depot from inner),
WAN covalent bonds (depot from outer membrane via HTTP/BTSP), mobile NUCLEUS
(aarch64 from peptidoglycan), and future topologies (container images, WASM
bundles) all flowing through the same diderm architecture.
"""
