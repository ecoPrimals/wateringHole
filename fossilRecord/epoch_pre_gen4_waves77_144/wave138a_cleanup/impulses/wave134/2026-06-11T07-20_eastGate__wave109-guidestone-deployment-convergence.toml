[guidestone]
description = """Every NUCLEUS deployment must satisfy all 5 guideStone properties:

  P1: DETERMINISTIC — same depot + same gate profile = identical NUCLEUS state
  P2: REFERENCE-TRACEABLE — every binary traces to provenance.toml (commit, rustc, timestamp, blake3)
  P3: SELF-VERIFYING — BLAKE3 fail-closed; mismatch = abort, no silent degradation
  P4: ENVIRONMENT-AGNOSTIC — musl-static ecoBins, no runtime deps, no sudo, no local builds
  P5: TOLERANCE-DOCUMENTED — named tolerances for depot staleness, mesh handshake, health convergence

The 6 existing deterministic deployment invariants (Wave 106 AAR) are the foundation:
  Binary authority, Checksum verification, Atomic replacement, Mesh bootstrap,
  Health verification, Source parity.

This FRAGO adds the abstraction layer that makes those invariants universal across topologies."""

