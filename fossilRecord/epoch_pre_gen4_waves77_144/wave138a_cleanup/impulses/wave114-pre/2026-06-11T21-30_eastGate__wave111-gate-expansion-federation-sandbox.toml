[aar_wave113_flockgate_wan.partition_tolerance_test]
description = "iptables DROP to 157.230.3.183 — simulate WAN partition for 104s"
pre_partition = "golgiBody reachable=true, last_seen_ms=22816"
during_5s = "reachable=true, last_seen_ms=37064 (climbing)"
during_20s = "reachable=true, last_seen_ms=56622 (climbing)"
during_60s = "reachable=true, last_seen_ms=104728 (climbing)"
post_partition_20s = "reachable=true, last_seen_ms=143977 (still climbing — no recovery probe)"
finding = """CRITICAL GAP: songbird reachability is STATIC — set once at mesh.init time, never actively probed.
Without an active federation connection (active_connections > 0), songbird has no mechanism to:
1. Detect that a peer became unreachable (no active heartbeat)
2. Trigger auto-reconnect (nothing to reconnect — connection was never established)
3. Report partition state (reachable flag is stale last-known state)

The auto-reconnect code (spawn_peer_health_loop, Stream 6) ONLY activates when there is an established
federation connection that drops. Since VPS hasn't enrolled flockGate as a peer, active_connections=0,
and the partition tolerance logic is never exercised."""
action_required = """cellMembrane (ironGate): Enroll flockGate as persistent peer on VPS songbird.
Only then can partition tolerance be validated operationally. Code is proven (via ephemeral canary)
but the ops-side enrollment is missing. Until enrollment: partition=UNDETECTABLE."""

