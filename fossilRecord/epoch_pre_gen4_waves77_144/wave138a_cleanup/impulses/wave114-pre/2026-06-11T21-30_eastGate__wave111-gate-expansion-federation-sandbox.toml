# Philosophy: Convergent evolution, not shared dependency. Each team
#             implements the standard idiomatically. No cross-primal crate.
#             sourDough pre-evolves the standard; new primals are born compliant.
# Deprecation: warn (wave 111-112) → error (112) → reject (113) → remove (114)
# ──────────────────────────────────────────────────────────────

[stream7]
id = "RIBOCIPHER-CONVERGENCE"
owner = "ALL teams (sourDough accelerates)"
priority = "P2"
guidestone_properties = ["P1-Deterministic", "P2-Reference-Traceable"]
description = """Replace fragile peek-and-guess protocol detection with riboCipher —
intentional transport signal routing modeled on ribosomal codon reading.
Each primal independently evolves to send/receive riboCipher signals.
Standard published in RIBOCIPHER_TRANSPORT_SIGNAL_STANDARD.md.

Root cause: ironGate/cellMembrane found that BTSP-encrypted first bytes are
indistinguishable from noise — peek-based routing hung on encrypted connections.
Additionally, primals disagree on what 'unknown byte' means (bearDog → BTSP,
biomeOS → HTTP). This divergence is a jelly-sting pattern that must converge.

sourDough accelerates adoption: scaffold bakes riboCipher into new primals,
validate audits existing primals, own IPC is the reference implementation."""

[stream7.tasks]
sourdough_reference = "sourDough: implement riboCipher in own IPC server as canonical reference implementation"
sourdough_validate = "sourDough: add `validate ribocipher` subcommand — audits primal accept loops for compliance"
sourdough_scaffold = "sourDough: update scaffold templates to emit riboCipher-compliant accept loops (new primals born compliant)"
sourdough_status = "✅ SHIPPED (1f68f64→28c0636): reference impl + deep debt (W111). WARN→ERROR escalation shipped (W112)."
beardog_server = "bearDog: implement riboCipher detection in unix_socket_ipc/server.rs and tcp_ipc/server.rs"
beardog_client = "bearDog: send clear signal (0xEC 0x01) from BTSP client connections"
beardog_status = "✅ SHIPPED (8efc963→123e318→cdcdff56f): server detect + client signal (W111). WARN→ERROR escalation shipped (W112)."
songbird_server = "songBird: implement riboCipher detection in pure_rust_server and bin_interface accept loops"
songbird_federation_mito = "songBird: send mito-obfuscated signal (0xED) for cross-gate federation connections"
songbird_status = "✅ SHIPPED (053163f3→677ec343→acf20b6e): all 3 accept loops + ribocipher module (W111). WARN→ERROR escalation shipped (W112)."
biomeos_api = "biomeOS: implement riboCipher detection in biomeos-api unix_server.rs (replaces {/[ vs HTTP guess)"
biomeos_neural = "biomeOS: implement riboCipher detection in neural_api_server/connection.rs"
biomeos_status = "✅ SHIPPED (v4.28→b10ad05f): riboCipher REJECT enforced (W113). Post-boot topology.rescan for NeuralRouter auto-registration. 0→N capability providers on startup."
sweetgrass_reference = "sweetGrass: update peek.rs as reference implementation — riboCipher first, legacy fallback second"
sweetgrass_status = "✅ SHIPPED (v0.7.57→3ddefbe): riboCipher reference in peek.rs (W111). WARN→ERROR escalation shipped (W112)."
primalspring_harness = "primalSpring: update nucleus_launcher and harness IPC to send clear signal"
primalspring_status = "✅ SHIPPED (93207ac→44469a9→92fcd13): clear signal on all IPC, port registry dedup, clippy cleanup (W111-112). No accept loop → WARN→ERROR N/A (already hard-asserts)."
cellmembrane_health = "cellMembrane: update uds_jsonrpc_call() to prepend [0xEC, 0x01] before JSON payload"
cellmembrane_config = "cellMembrane: add [transport.ribocipher] section to membrane.toml with unsignalled_policy=warn"
cellmembrane_status = "✅ SHIPPED (35ad803→922eb24→54eee01): mito-tier HKDF+HMAC, clear on 6 UDS clients, config, dispatch SRP (W111). WARN→ERROR + health probe fix + plasmidBin resolution + UDS probe fallback for transitional deploys (W112)."

